[workspace]
resolver = "3"
members = ["parser", "printer", "generator"]
default-members = ["printer"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
kospi-parser = { path = "parser" }
memmap2 = "0.9.10"
clap = { version = "4.6.0", features = ["derive"] }
criterion = "0.8.2"
