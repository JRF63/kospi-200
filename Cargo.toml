[package]
name = "tsuru-challenge"
version = "0.1.0"
edition = "2024"
default-run = "parse"

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
memmap2 = "0.9.10"

# The following are for the dataset generator. TODO: Maybe use a cargo workspace?
pcap-file = "2.0.0"
rand_core = "0.10.1"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.0"

[dev-dependencies]
criterion = "0.8.2"
